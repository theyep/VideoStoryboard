<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스토리보드 생성기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
        }

        :root {
            --bg-color: #f5f5f5;
            --text-color: #333;
            --sidebar-bg: #1e1e1e;
            --topbar-bg: #fff;
            --topbar-border: #ddd;
            --container-bg: #eaeaea;
            --card-input-bg: #d0d0d0;
            --card-num-color: #333;
            --btn-bg: #007acc;
            --btn-hover: #005999;
            --item-bg: #2a2a2a;
        }

        /* 다크 모드 테마 변수 설정 */
        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --sidebar-bg: #181818;
            --topbar-bg: #1e1e1e;
            --topbar-border: #333;
            --container-bg: #1e1e1e;
            --card-input-bg: #2d2d2d;
            --card-num-color: #e0e0e0;
            --item-bg: #2c2c2c;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        .toggle-btn {
            background: #1e1e1e;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px 10px;
            gap: 10px;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            bottom: 0;
            left: -260px;
            z-index: 999;
            transition: left 0.3s ease;
        }

        #sidebar.open {
            left: 0;
        }

        #sidebar h2 {
            font-size: 16px;
            padding: 0 10px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .board-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .board-item-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--item-bg);
            border-radius: 6px;
            padding-right: 8px;
            cursor: grab;
            transition: transform 0.2s, opacity 0.2s;
        }

        .board-item-wrapper:active {
            cursor: grabbing;
        }

        .board-item-wrapper.dragging {
            opacity: 0.5;
            background-color: #444;
        }

        .board-item-wrapper.active {
            background-color: var(--btn-bg);
        }

        .drag-handle {
            padding: 0 8px;
            color: #888;
            font-size: 14px;
            user-select: none;
        }

        .board-item {
            padding: 10px 4px;
            flex-grow: 1;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            color: #fff;
            user-select: none;
        }

        .delete-board-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .delete-board-btn:hover {
            background-color: rgba(255, 0, 0, 0.2);
        }

        .add-btn {
            padding: 12px;
            background-color: #333;
            color: white;
            border: 1px dashed #555;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }

        .add-btn:hover {
            background-color: #444;
        }

        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            width: 100%;
        }

        .top-bar {
            padding: 10px 20px;
            background-color: var(--topbar-bg);
            border-bottom: 1px solid var(--topbar-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .export-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            background-color: var(--btn-bg);
            color: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }

        .export-btn:hover {
            background-color: var(--btn-hover);
        }

        .theme-btn {
            background-color: #4A5568;
        }

        .theme-btn:hover {
            background-color: #2D3748;
        }

        .pdf-btn {
            background-color: #e53e3e;
        }

        .pdf-btn:hover {
            background-color: #c53030;
        }

        #storyboard-container {
            padding: 20px 10px;
            background-color: var(--container-bg);
            min-height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #export-area {
            background-color: var(--container-bg);
            padding: 40px 30px;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
            position: relative;
        }

        .timestamp-display {
            align-self: flex-end;
            font-size: 12px;
            color: var(--text-color);
            opacity: 0.7;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .title-input {
            font-size: 32px;
            font-weight: bold;
            border: none;
            background: transparent;
            text-align: center;
            margin-bottom: 10px;
            width: 90%;
            outline: none;
            line-height: 1.4;
            padding: 6px 0;
            box-sizing: border-box;
            color: var(--text-color);
        }

        .auto-expand-textarea {
            background-color: var(--card-input-bg);
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            color: var(--text-color);
            outline: none;
            resize: none;
            overflow: hidden;
            word-break: break-all;
            line-height: 1.4;
            box-sizing: border-box;
        }

        .sub-details {
            width: 100%;
            max-width: 400px;
            min-height: 60px;
        }

        .board-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        .card {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: transparent;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 4px 0;
        }

        .card-number {
            font-size: 16px;
            font-weight: bold;
            color: var(--card-num-color);
        }

        .delete-card-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-box {
            width: 100%;
            background-color: #666;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9; 
            border-radius: 4px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            display: block;
        }

        .card-description {
            width: 100%;
            min-height: 50px;
            margin-top: 4px;
        }

        .controls-container {
            margin-top: 25px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: 30px;
        }

        .pagination {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .page-btn {
            padding: 6px 12px;
            background-color: var(--topbar-bg);
            border: 1px solid var(--topbar-border);
            color: var(--text-color);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .page-btn.active {
            background-color: var(--btn-bg);
            color: white;
            border-color: var(--btn-bg);
        }

        .add-more-btn {
            padding: 10px 24px;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-more-btn:hover {
            background-color: #333;
        }

        input[type="file"] {
            display: none;
        }

        @media (min-width: 768px) {
            #sidebar {
                position: relative;
                left: 0;
            }

            .toggle-btn {
                display: none;
            }

            #sidebar-overlay {
                display: none !important;
            }

            .board-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            #storyboard-container {
                padding: 40px;
            }
        }

        .capturing .delete-card-btn {
            display: none !important;
        }
        .capturing .board-grid {
            grid-template-columns: repeat(3, 1fr) !important;
        }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div id="sidebar">
        <h2>스토리보드 목록</h2>
        <div class="board-list" id="board-list"></div>
        <button class="add-btn" onclick="createNewBoard()">+</button>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
            <div class="btn-group">
                <button class="export-btn theme-btn" id="theme-toggle-btn" onclick="toggleDarkMode()">🌙 다크모드</button>
                <button class="export-btn" onclick="exportBoard('png')">PNG 저장</button>
                <button class="export-btn" onclick="exportBoard('jpeg')">JPG 저장</button>
                <button class="export-btn pdf-btn" onclick="exportPDF()">PDF 내보내기</button>
            </div>
        </div>

        <div id="storyboard-container">
            <div id="export-area">
                <div class="header-section">
                    <div class="timestamp-display" id="timestamp-display">최종 수정: -</div>
                    <input type="text" class="title-input" id="board-title" value="TYPE NAME" onblur="checkTitleEmpty(this)" oninput="updateTitle(this.value)">
                    <textarea class="auto-expand-textarea sub-details" id="sub-details" placeholder="Sub Details (영상 사이즈, 프레임 등)" oninput="handleTextareaInput(this)"></textarea>
                </div>

                <div class="board-grid" id="board-grid"></div>
            </div>

            <div class="controls-container">
                <div class="pagination" id="pagination"></div>
                <button class="add-more-btn" onclick="addCards(3)">+ 3개 추가하기</button>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)">

    <script>
        let currentBoardId = null;
        let activeImageBox = null;
        let currentPage = 1;
        const ITEMS_PER_PAGE = 9;
        const STORAGE_KEY = 'storyboards_data_v3';

        // 날짜, 시간, 시간대 포맷 함수
        function getFormattedTimestamp() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const timeStr = now.toLocaleTimeString('ko-KR', { hour12: false });
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            return `최종 수정: ${dateStr} ${timeStr} (${timeZone})`;
        }

        function updateTimestampDisplay(text) {
            const el = document.getElementById('timestamp-display');
            if (el) el.innerText = text || getFormattedTimestamp();
        }

        // 다크 모드 토글 및 저장 로직
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('theme-toggle-btn');
            btn.innerText = isDark ? '☀️ 라이트모드' : '🌙 다크모드';
            localStorage.setItem('theme_mode', isDark ? 'dark' : 'light');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme_mode');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-toggle-btn').innerText = '☀️ 라이트모드';
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            if (window.innerWidth < 768) {
                overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
            }
        }

        function getStorageData() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { order: [], boards: {} };
        }

        function setStorageData(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                alert("저장 용량이 초과되었습니다. 필요없는 스토리보드를 정리해 주세요.");
            }
        }

        window.onload = () => {
            initTheme();
            const data = getStorageData();
            if (!data.order || data.order.length === 0) {
                createNewBoard();
            } else {
                currentBoardId = data.order[0];
                renderSidebar();
                loadBoard(currentBoardId);
            }
        };

        function createNewBoard() {
            const data = getStorageData();
            const id = 'board_' + Date.now();
            const timeStamp = getFormattedTimestamp();

            data.boards[id] = {
                title: 'TYPE NAME',
                subDetails: '',
                updatedAt: timeStamp,
                cards: [
                    { img: '', desc: '', ratio: '16/9' },
                    { img: '', desc: '', ratio: '16/9' },
                    { img: '', desc: '', ratio: '16/9' }
                ]
            };
            if (!data.order) data.order = [];
            data.order.push(id);

            setStorageData(data);
            currentBoardId = id;
            currentPage = 1;
            renderSidebar();
            loadBoard(id);

            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('open')) toggleSidebar();
            }
        }

        function deleteBoard(id, e) {
            e.stopPropagation();
            if (!confirm("해당 스토리보드를 삭제하시겠습니까?")) return;

            const data = getStorageData();
            delete data.boards[id];
            data.order = data.order.filter(boardId => boardId !== id);

            setStorageData(data);

            if (data.order.length > 0) {
                currentBoardId = data.order[0];
            } else {
                createNewBoard();
                return;
            }
            renderSidebar();
            loadBoard(currentBoardId);
        }

        function renderSidebar() {
            const data = getStorageData();
            const listEl = document.getElementById('board-list');
            listEl.innerHTML = '';

            data.order.forEach(id => {
                const board = data.boards[id];
                if (!board) return;

                const wrapper = document.createElement('div');
                wrapper.className = `board-item-wrapper ${id === currentBoardId ? 'active' : ''}`;
                wrapper.draggable = true;
                wrapper.dataset.id = id;

                const handle = document.createElement('span');
                handle.className = 'drag-handle';
                handle.innerHTML = '⋮⋮';

                const item = document.createElement('div');
                item.className = 'board-item';
                item.innerText = board.title || 'TYPE NAME';
                item.onclick = () => {
                    currentBoardId = id;
                    currentPage = 1;
                    renderSidebar();
                    loadBoard(id);
                    if (window.innerWidth < 768) toggleSidebar();
                };

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-board-btn';
                delBtn.innerText = '✕';
                delBtn.onclick = (e) => deleteBoard(id, e);

                wrapper.appendChild(handle);
                wrapper.appendChild(item);
                wrapper.appendChild(delBtn);

                addDragEvents(wrapper);

                listEl.appendChild(wrapper);
            });
        }

        let draggedItem = null;

        function addDragEvents(el) {
            el.addEventListener('dragstart', (e) => {
                draggedItem = el;
                setTimeout(() => el.classList.add('dragging'), 0);
            });

            el.addEventListener('dragend', () => {
                el.classList.remove('dragging');
                draggedItem = null;
                saveNewOrder();
            });

            el.addEventListener('dragover', (e) => {
                e.preventDefault();
                const listEl = document.getElementById('board-list');
                const afterElement = getDragAfterElement(listEl, e.clientY);
                if (afterElement == null) {
                    listEl.appendChild(draggedItem);
                } else {
                    listEl.insertBefore(draggedItem, afterElement);
                }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.board-item-wrapper:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function saveNewOrder() {
            const data = getStorageData();
            const newOrder = [];
            document.querySelectorAll('.board-item-wrapper').forEach(wrapper => {
                newOrder.push(wrapper.dataset.id);
            });
            data.order = newOrder;
            setStorageData(data);
        }

        function loadBoard(id) {
            const data = getStorageData();
            const board = data.boards[id];
            if (!board) return;

            const titleInput = document.getElementById('board-title');
            const subDetailsInput = document.getElementById('sub-details');

            titleInput.value = board.title;
            subDetailsInput.value = board.subDetails;
            updateTimestampDisplay(board.updatedAt || getFormattedTimestamp());

            autoExpand(subDetailsInput);
            renderGrid();
        }

        function renderGrid() {
            const data = getStorageData();
            const board = data.boards[currentBoardId];
            if (!board) return;

            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';

            const totalCards = board.cards.length;
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, totalCards);
            const pageCards = board.cards.slice(startIndex, endIndex);

            pageCards.forEach((cardData, index) => {
                const globalIndex = startIndex + index;
                grid.appendChild(createCardElement(globalIndex + 1, cardData.img, cardData.desc, cardData.ratio, globalIndex));
            });

            renderPagination(totalCards);
        }

        function createCardElement(number, imgSrc, descText, ratio, globalIndex) {
            const card = document.createElement('div');
            card.className = 'card';

            const imgBox = document.createElement('div');
            imgBox.className = 'image-box';
            if (ratio) imgBox.style.aspectRatio = ratio;

            if (imgSrc) {
                const img = document.createElement('img');
                img.src = imgSrc;
                imgBox.appendChild(img);
            }
            imgBox.onclick = () => triggerImageUpload(imgBox, globalIndex);

            const header = document.createElement('div');
            header.className = 'card-header';

            const numEl = document.createElement('div');
            numEl.className = 'card-number';
            numEl.innerText = `#${number}`;

            const delCardBtn = document.createElement('button');
            delCardBtn.className = 'delete-card-btn';
            delCardBtn.innerText = '✕';
            delCardBtn.onclick = () => deleteCard(globalIndex);

            header.appendChild(numEl);
            header.appendChild(delCardBtn);

            const descEl = document.createElement('textarea');
            descEl.className = 'auto-expand-textarea card-description';
            descEl.placeholder = 'description';
            descEl.value = descText || '';
            descEl.oninput = (e) => {
                handleTextareaInput(e.target);
                saveCurrentBoardData();
            };

            card.appendChild(imgBox);
            card.appendChild(header);
            card.appendChild(descEl);

            setTimeout(() => autoExpand(descEl), 0);

            return card;
        }

        function renderPagination(totalItems) {
            const paginationEl = document.getElementById('pagination');
            paginationEl.innerHTML = '';
            const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE) || 1;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    currentPage = i;
                    renderGrid();
                };
                paginationEl.appendChild(btn);
            }
        }

        function autoExpand(field) {
            field.style.height = 'inherit';
            const computed = window.getComputedStyle(field);
            const height = field.scrollHeight + parseInt(computed.getPropertyValue('border-top-width'), 10) + parseInt(computed.getPropertyValue('border-bottom-width'), 10);
            field.style.height = height + 'px';
        }

        function handleTextareaInput(field) {
            autoExpand(field);
            saveCurrentBoardData();
        }

        function addCards(count = 3) {
            const data = getStorageData();
            const board = data.boards[currentBoardId];

            for (let i = 0; i < count; i++) {
                board.cards.push({ img: '', desc: '', ratio: '16/9' });
            }

            setStorageData(data);
            currentPage = Math.ceil(board.cards.length / ITEMS_PER_PAGE);
            renderGrid();
        }

        function deleteCard(index) {
            const data = getStorageData();
            const board = data.boards[currentBoardId];

            board.cards.splice(index, 1);
            setStorageData(data);

            const totalPages = Math.ceil(board.cards.length / ITEMS_PER_PAGE) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            renderGrid();
        }

        function checkTitleEmpty(input) {
            if (input.value.trim() === '') {
                input.value = 'TYPE NAME';
            }
            saveCurrentBoardData();
            renderSidebar();
        }

        function updateTitle() {
            renderSidebar();
        }

        function triggerImageUpload(box, globalIndex) {
            activeImageBox = { box, globalIndex };
            document.getElementById('file-input').click();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file || !activeImageBox) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxW = 1200;
                    let width = img.naturalWidth;
                    let height = img.naturalHeight;

                    if (width > maxW) {
                        height = Math.round((height * maxW) / width);
                        width = maxW;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    const ratio = `${width} / ${height}`;

                    const data = getStorageData();
                    data.boards[currentBoardId].cards[activeImageBox.globalIndex].img = resizedDataUrl;
                    data.boards[currentBoardId].cards[activeImageBox.globalIndex].ratio = ratio;

                    setStorageData(data);
                    renderGrid();
                };
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function saveCurrentBoardData() {
            if (!currentBoardId) return;

            const data = getStorageData();
            const board = data.boards[currentBoardId];
            if (!board) return;

            const timeStamp = getFormattedTimestamp();
            board.title = document.getElementById('board-title').value || 'TYPE NAME';
            board.subDetails = document.getElementById('sub-details').value;
            board.updatedAt = timeStamp;

            updateTimestampDisplay(timeStamp);

            const gridCards = document.querySelectorAll('.card');
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;

            gridCards.forEach((cardEl, idx) => {
                const globalIndex = startIndex + idx;
                const descVal = cardEl.querySelector('.card-description').value;
                if (board.cards[globalIndex]) {
                    board.cards[globalIndex].desc = descVal;
                }
            });

            setStorageData(data);
        }

        /* 캡처용 공통 클론 변환 함수 */
        function prepareCloneForCapture(clonedDoc) {
            const clonedExportArea = clonedDoc.getElementById('export-area');
            if (!clonedExportArea) return;

            const isDark = document.body.classList.contains('dark-mode');
            const bgBoxColor = isDark ? '#2d2d2d' : '#d0d0d0';
            const textColor = isDark ? '#e0e0e0' : '#333';

            // 저장 시 최신 업데이트 날짜 텍스트 숨기기
            const timeEl = clonedDoc.getElementById('timestamp-display');
            if (timeEl) {
                timeEl.style.display = 'none';
            }

            const titleInput = clonedDoc.getElementById('board-title');
            if (titleInput) {
                const titleDiv = clonedDoc.createElement('div');
                titleDiv.innerText = titleInput.value || 'TYPE NAME';
                titleDiv.style.cssText = `
                    font-size: 32px;
                    font-weight: bold;
                    text-align: center;
                    width: 100%;
                    margin-bottom: 10px;
                    line-height: 1.4;
                    color: ${textColor};
                    padding: 6px 0;
                    box-sizing: border-box;
                `;
                titleInput.parentNode.replaceChild(titleDiv, titleInput);
            }

            const subDetails = clonedDoc.getElementById('sub-details');
            if (subDetails) {
                const subDiv = clonedDoc.createElement('div');
                subDiv.innerText = subDetails.value || subDetails.placeholder || '';
                subDiv.style.cssText = `
                    background-color: ${bgBoxColor};
                    border-radius: 4px;
                    padding: 10px;
                    font-size: 13px;
                    color: ${subDetails.value ? textColor : '#777'};
                    width: 100%;
                    max-width: 400px;
                    min-height: 60px;
                    word-break: break-all;
                    white-space: pre-wrap;
                    line-height: 1.4;
                    box-sizing: border-box;
                    text-align: left;
                `;
                subDetails.parentNode.replaceChild(subDiv, subDetails);
            }

            const descs = clonedExportArea.querySelectorAll('.card-description');
            descs.forEach(desc => {
                const descDiv = clonedDoc.createElement('div');
                descDiv.innerText = desc.value || desc.placeholder || '';
                descDiv.style.cssText = `
                    background-color: ${bgBoxColor};
                    border-radius: 4px;
                    padding: 10px;
                    font-size: 13px;
                    color: ${desc.value ? textColor : '#777'};
                    width: 100%;
                    min-height: 50px;
                    margin-top: 4px;
                    word-break: break-all;
                    white-space: pre-wrap;
                    line-height: 1.4;
                    box-sizing: border-box;
                    text-align: left;
                `;
                desc.parentNode.replaceChild(descDiv, desc);
            });
        }

        /* 이미지 (PNG/JPG) 내보내기 */
        function exportBoard(format) {
            const exportArea = document.getElementById('export-area');
            const mainContent = document.getElementById('main-content');

            const prevScroll = mainContent.scrollTop;
            mainContent.scrollTop = 0;

            document.body.classList.add('capturing');

            html2canvas(exportArea, {
                scale: 2,
                useCORS: true,
                logging: false,
                scrollX: 0,
                scrollY: 0,
                windowWidth: 1200,
                onclone: (clonedDoc) => prepareCloneForCapture(clonedDoc)
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `${document.getElementById('board-title').value || 'storyboard'}_page${currentPage}.${format}`;
                link.href = canvas.toDataURL(`image/${format === 'jpg' ? 'jpeg' : 'png'}`, 1.0);
                link.click();

                document.body.classList.remove('capturing');
                mainContent.scrollTop = prevScroll;
            }).catch(() => {
                document.body.classList.remove('capturing');
                mainContent.scrollTop = prevScroll;
            });
        }

        /* PDF 문서 내보내기 */
        function exportPDF() {
            const exportArea = document.getElementById('export-area');
            const mainContent = document.getElementById('main-content');

            const prevScroll = mainContent.scrollTop;
            mainContent.scrollTop = 0;

            document.body.classList.add('capturing');

            html2canvas(exportArea, {
                scale: 2,
                useCORS: true,
                logging: false,
                scrollX: 0,
                scrollY: 0,
                windowWidth: 1200,
                onclone: (clonedDoc) => prepareCloneForCapture(clonedDoc)
            }).then(canvas => {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');

                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const imgWidth = 210; // A4 가로 (mm)
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                pdf.addImage(imgData, 'JPEG', 0, 10, imgWidth, imgHeight);
                pdf.save(`${document.getElementById('board-title').value || 'storyboard'}_page${currentPage}.pdf`);

                document.body.classList.remove('capturing');
                mainContent.scrollTop = prevScroll;
            }).catch(() => {
                document.body.classList.remove('capturing');
                mainContent.scrollTop = prevScroll;
            });
        }
    </script>
